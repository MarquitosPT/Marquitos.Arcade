<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasca do Zé | Marquitos Arcade</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <a class="back-link" href="../../index.html">← Voltar à arcade</a>
      <h1>Tasca do Zé</h1>
      <p>
        Atira dois dados e tenta ficar o mais perto possível de 7 para
        maximizares a tua pontuação.
      </p>

      <div class="panel">
        <label>
          Nome do jogador
          <input id="player-name" maxlength="24" placeholder="MarquitosPT" />
        </label>
        <button id="roll-btn" type="button">Jogar rodada</button>
      </div>

      <div class="result" id="result-box">
        <p>Dado 1: -</p>
        <p>Dado 2: -</p>
        <p>Total: -</p>
        <p>Pontos ganhos: -</p>
      </div>
    </main>

    <script src="./tasca.js"></script>
  </body>
</html>
