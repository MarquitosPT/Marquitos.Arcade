<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pixel Racing | Marquitos Arcade</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon3_64x64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon3_32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon3_16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon3.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b0710" />
    <meta name="msapplication-TileColor" content="#123a5e" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Marquitos Arcade" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #050308;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            touch-action: none;
        }

        #wrap {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            background: #050308;
            display: block;
        }

        #startScreen, #pauseScreen, #resultScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 50% 20%, rgba(60,20,80,0.55), rgba(4,3,8,0.96) 70%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            z-index: 10;
            text-align: center;
            padding: 20px;
            overflow-y: auto;
        }

        #pauseScreen, #resultScreen { display: none; }

        .title {
            font-size: 11vw;
            letter-spacing: 0.12em;
            font-weight: bold;
            color: #ffcf3f;
            text-shadow: 0 0 6px #ff7a1a, 0 0 22px #ff2fa0, 0 4px 0 #7a1a45;
            margin-bottom: 2px;
            animation: pulseGlow 1.8s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { text-shadow: 0 0 6px #ff7a1a, 0 0 22px #ff2fa0, 0 4px 0 #7a1a45; }
            50% { text-shadow: 0 0 14px #ffe27a, 0 0 34px #00e5ff, 0 4px 0 #7a1a45; }
        }

        .sub {
            font-size: 3.2vw;
            opacity: 0.75;
            margin-bottom: 20px;
            letter-spacing: 0.25em;
            color: #00e5ff;
        }

        .btn {
            background: linear-gradient(180deg, #ffcf3f, #ff7a1a);
            color: #1a0d00;
            border: none;
            padding: 14px 40px;
            font-family: inherit;
            font-size: 4vw;
            letter-spacing: 0.15em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
            border-radius: 6px;
            box-shadow: 0 0 14px rgba(255,122,26,0.6);
        }

        .btnOutline {
            background: transparent;
            color: #fff;
            border: 2px solid #00e5ff;
            padding: 12px 30px;
            font-family: inherit;
            font-size: 3.4vw;
            letter-spacing: 0.1em;
            margin-top: 10px;
            border-radius: 6px;
        }

        .row {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .modeBtn, .trackBtn, .diffBtn {
            background: transparent;
            color: #fff;
            border: 2px solid #666;
            padding: 10px 16px;
            font-family: inherit;
            font-size: 3.2vw;
            letter-spacing: 0.06em;
            border-radius: 6px;
            cursor: pointer;
        }

        .modeBtn.active, .trackBtn.active, .diffBtn.active {
            background: #00e5ff;
            color: #04202a;
            border-color: #00e5ff;
            box-shadow: 0 0 10px rgba(0,229,255,0.7);
        }

        .trackBtn { font-size: 2.9vw; }

        .nameInput {
            background: rgba(255,255,255,0.05);
            border: 2px solid #fff;
            color: #fff;
            padding: 10px 16px;
            font-family: inherit;
            font-size: 3.2vw;
            text-align: center;
            letter-spacing: 0.05em;
            width: 100%;
            max-width: 280px;
            border-radius: 6px;
        }

        .nameInput::placeholder { color: rgba(255,255,255,0.5); }

        #hint {
            margin-top: 16px;
            font-size: 2.6vw;
            opacity: 0.55;
        }

        .topBar {
            position: absolute;
            top: max(12px, env(safe-area-inset-top));
            right: 12px;
            display: flex;
            gap: 8px;
            z-index: 20;
        }

        .topBtn {
            color: #fff;
            background: rgba(0,0,0,0.45);
            border: 1px solid #666;
            font-family: inherit;
            font-size: 14px;
            padding: 6px 14px;
            letter-spacing: 0.1em;
            border-radius: 4px;
        }

        .bannerText {
            font-size: 7vw;
            font-weight: bold;
            letter-spacing: 0.1em;
            color: #fff;
            text-shadow: 0 0 10px #00e5ff, 0 0 26px #ff2fa0;
        }

        .sectionLabel {
            font-size: 2.6vw;
            opacity: 0.7;
            letter-spacing: 0.2em;
            margin-bottom: 8px;
            color: #ff9d3f;
        }

        table.resultTable {
            border-collapse: collapse;
            margin: 10px auto 6px;
            width: min(92vw, 480px);
        }

        table.resultTable td {
            padding: 7px 10px;
            font-size: 3vw;
            border-bottom: 1px solid rgba(255,255,255,0.12);
        }

        table.resultTable .me { color: #00e5ff; font-weight: bold; }
        table.resultTable .medal { font-size: 3.6vw; width: 1.6em; }
        table.resultTable .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

        @media (min-width: 620px) {
            .title { font-size: 56px; }
            .sub { font-size: 16px; }
            .btn { font-size: 20px; }
            .btnOutline { font-size: 16px; }
            .modeBtn, .trackBtn, .diffBtn { font-size: 14px; }
            .nameInput { font-size: 15px; }
            #hint { font-size: 12px; }
            .bannerText { font-size: 34px; }
            .sectionLabel { font-size: 12px; }
            table.resultTable td { font-size: 15px; }
            table.resultTable .medal { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div id="wrap">
        <div class="topBar">
            <a class="topBtn" id="arcadeLink" href="/" style="text-decoration:none; display:inline-block;">← ARCADE</a>
            <a class="topBtn" id="scoresLink" href="/pontuacoes?jogo=pixel-racing#pixel-racing" style="text-decoration:none; display:inline-block;">🏆</a>
            <button class="topBtn" id="pauseBtn" style="display:none;">II</button>
            <button class="topBtn" id="endBtn" style="display:none;">✕ SAIR</button>
        </div>
        <canvas id="game"></canvas>

        <div id="startScreen">
            <div class="title">PIXEL RACING</div>
            <div class="sub">BOOST • DRIFT • TORNEIOS</div>

            <div class="row" id="modeRow">
                <button class="modeBtn active" data-mode="quick">CORRIDA RÁPIDA</button>
                <button class="modeBtn" data-mode="tournament">TORNEIO (3 PISTAS)</button>
            </div>

            <div id="trackRow" class="row">
                <button class="trackBtn active" data-track="0">🌿 Circuito Neon</button>
                <button class="trackBtn" data-track="1">🏜️ Curva Dupla</button>
                <button class="trackBtn" data-track="2">🌆 Deserto Rápido</button>
            </div>

            <div class="row" id="nameRow">
                <input type="text" id="playerNameInput" class="nameInput" placeholder="O TEU NOME" maxlength="20">
            </div>

            <div class="row" id="diffRow">
                <button class="diffBtn" data-lvl="0.80">FÁCIL</button>
                <button class="diffBtn active" data-lvl="0.95">MÉDIO</button>
                <button class="diffBtn" data-lvl="1.08">DIFÍCIL</button>
            </div>

            <button class="btn" id="startBtn">ARRANCAR</button>
            <div id="hint">3 adversários CPU · Arrasta ou usa as setas · Segura DRIFT nas curvas para ganhar BOOST</div>
        </div>

        <div id="pauseScreen">
            <div class="title" style="font-size:8vw;">PAUSA</div>
            <button class="btn" id="resumeBtn">CONTINUAR</button>
            <button class="btnOutline" id="quitBtn">SAIR PARA O MENU</button>
        </div>

        <div id="resultScreen">
            <div id="resultBody"></div>
        </div>
    </div>

    <script>
        (function () {
            // ============================== Utils ==============================
            const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
            const lerp = (a, b, t) => a + (b - a) * t;
            const normAngle = (a) => { a = a % (Math.PI * 2); if (a > Math.PI) a -= Math.PI * 2; if (a < -Math.PI) a += Math.PI * 2; return a; };
            const lerpAngle = (a, b, t) => a + normAngle(b - a) * t;
            const ordinal = (n) => n + 'º';
            const rand = (a, b) => a + Math.random() * (b - a);
            const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

            function shuffle(arr) {
                const a = arr.slice();
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            }

            function fmtTime(ms) {
                if (ms == null) return '--:--.--';
                const total = Math.max(0, ms);
                const m = Math.floor(total / 60000);
                const s = Math.floor((total % 60000) / 1000);
                const cs = Math.floor((total % 1000) / 10);
                return `${m}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
            }

            // ============================== DOM ==============================
            const canvas = document.getElementById('game');
            const ctx = canvas.getContext('2d');
            const startScreen = document.getElementById('startScreen');
            const pauseScreen = document.getElementById('pauseScreen');
            const resultScreen = document.getElementById('resultScreen');
            const resultBody = document.getElementById('resultBody');
            const startBtn = document.getElementById('startBtn');
            const resumeBtn = document.getElementById('resumeBtn');
            const quitBtn = document.getElementById('quitBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const endBtn = document.getElementById('endBtn');
            const modeRow = document.getElementById('modeRow');
            const trackRow = document.getElementById('trackRow');
            const diffRow = document.getElementById('diffRow');
            const nameInput = document.getElementById('playerNameInput');
            const topBar = document.querySelector('.topBar');
            const arcadeLink = document.getElementById('arcadeLink');
            const scoresLink = document.getElementById('scoresLink');

            const API_URL = '/api/scores/pixel-racing';
            const NAME_KEY = 'pixelRacingPlayerName_v1';
            try { nameInput.value = localStorage.getItem(NAME_KEY) || ''; } catch (e) { }
            fetch('/api/account/me').then(r => r.ok ? r.json() : null).then(data => {
                if (data && data.displayName && !nameInput.value) nameInput.value = data.displayName;
            }).catch(() => { });

            function submitScore(name, score) {
                if (!(score > 0)) return;
                try { localStorage.setItem(NAME_KEY, name); } catch (e) { }
                fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, score })
                }).catch(() => { });
            }

            function setInGameControls(inGame) {
                arcadeLink.style.display = inGame ? 'none' : 'inline-block';
                scoresLink.style.display = inGame ? 'none' : 'inline-block';
                pauseBtn.style.display = inGame ? 'inline-block' : 'none';
                endBtn.style.display = inGame ? 'inline-block' : 'none';
            }

            // ============================== Sound ==============================
            let audioCtx = null, engineOsc = null, engineFilter = null, engineGain = null;
            function ensureAudio() {
                if (!audioCtx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (AC) audioCtx = new AC();
                    if (audioCtx) {
                        engineOsc = audioCtx.createOscillator();
                        engineFilter = audioCtx.createBiquadFilter();
                        engineGain = audioCtx.createGain();
                        engineOsc.type = 'sawtooth';
                        engineFilter.type = 'lowpass';
                        engineFilter.frequency.value = 400;
                        engineGain.gain.value = 0;
                        engineOsc.connect(engineFilter);
                        engineFilter.connect(engineGain);
                        engineGain.connect(audioCtx.destination);
                        engineOsc.start();
                    }
                }
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            }
            function beep(freq, duration, type, volume, delay) {
                if (!audioCtx) return;
                type = type || 'square';
                volume = volume === undefined ? 0.15 : volume;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.value = volume;
                const t0 = audioCtx.currentTime + (delay || 0);
                gain.gain.setValueAtTime(volume, t0);
                gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t0);
                osc.stop(t0 + duration + 0.02);
            }
            const sfx = {
                tick: () => beep(520, 0.12, 'square', 0.2),
                go: () => { beep(660, 0.1, 'square', 0.22); beep(880, 0.16, 'square', 0.22, 0.12); beep(1180, 0.22, 'square', 0.24, 0.26); },
                pad: () => { beep(920, 0.08, 'sine', 0.2); beep(1300, 0.12, 'sine', 0.18, 0.05); },
                boost: () => { for (let i = 0; i < 6; i++) beep(300 + i * 90, 0.06, 'sawtooth', 0.1, i * 0.02); },
                driftPerfect: () => { beep(700, 0.08, 'triangle', 0.2); beep(1050, 0.14, 'triangle', 0.2, 0.08); },
                bump: () => beep(110, 0.1, 'square', 0.2),
                wall: () => beep(90, 0.12, 'sawtooth', 0.18),
                lap: () => { beep(600, 0.08, 'square', 0.16); beep(900, 0.1, 'square', 0.16, 0.09); },
                finish: () => { [660, 880, 990, 1320].forEach((f, i) => beep(f, 0.16, 'square', 0.22, i * 0.14)); }
            };
            function updateEngineSound(speedFrac, boosting) {
                if (!engineGain) return;
                const now = audioCtx.currentTime;
                engineGain.gain.linearRampToValueAtTime(0.05 + speedFrac * 0.05 + (boosting ? 0.04 : 0), now + 0.05);
                engineOsc.frequency.linearRampToValueAtTime(70 + speedFrac * 180 + (boosting ? 60 : 0), now + 0.05);
                engineFilter.frequency.linearRampToValueAtTime(300 + speedFrac * 900, now + 0.05);
            }
            function muteEngine() { if (engineGain) engineGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1); }

            // ============================== Physics constants ==============================
            const LAPS_REQUIRED = 3;
            const CAR_LEN = 30, CAR_W = 16, CAR_RADIUS = 14;
            const MAX_SPEED = 380;
            const BOOST_MULT = 1.5;
            const ACCEL = 320;
            const BRAKE_DECEL = 460;
            const OFFTRACK_DAMP = 0.5;
            const GRIP_NORMAL = 9, GRIP_DRIFT = 3.0;
            const TURN_RATE = 2.8;
            const DRIFT_TURN_MULT = 1.3;
            const DRIFT_MIN_SPEED = 80;
            const BOOST_DRAIN = 42, BOOST_REGEN = 7;
            const DRIFT_CHARGE_RATE = 60, DRIFT_TO_BOOST = 0.7, DRIFT_PERFECT = 60;
            const CAM_FOLLOW = 6;
            const ZOOM = 0.62;
            const RACE_POINTS = [30, 20, 12, 6];

            // ============================== Tracks ==============================
            function buildTrack(def) {
                const N = 420;
                const pts = [];
                for (let i = 0; i < N; i++) {
                    const t = (i / N) * Math.PI * 2;
                    let r = 1;
                    for (const h of def.harmonics) r += h.amp * Math.sin(h.freq * t + (h.phase || 0));
                    pts.push({
                        x: def.cx + def.rx * r * Math.cos(t),
                        y: def.cy + def.ry * r * Math.sin(t)
                    });
                }
                const tang = [], norm = [], segLen = [];
                for (let i = 0; i < N; i++) {
                    const p0 = pts[(i - 1 + N) % N], p1 = pts[(i + 1) % N];
                    let dx = p1.x - p0.x, dy = p1.y - p0.y;
                    const len = Math.hypot(dx, dy) || 1;
                    dx /= len; dy /= len;
                    tang.push({ x: dx, y: dy });
                    norm.push({ x: -dy, y: dx });
                }
                let total = 0;
                for (let i = 0; i < N; i++) {
                    const j = (i + 1) % N;
                    total += Math.hypot(pts[j].x - pts[i].x, pts[j].y - pts[i].y);
                }
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                for (const p of pts) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); }
                const bbox = { minX, maxX, minY, maxY, w: maxX - minX, h: maxY - minY };
                const pads = [Math.floor(N * 0.22), Math.floor(N * 0.52), Math.floor(N * 0.82)];

                const decor = [];
                if (def.theme !== 'night') {
                    for (let i = 0; i < 70; i++) {
                        const x = rand(bbox.minX - 260, bbox.maxX + 260);
                        const y = rand(bbox.minY - 260, bbox.maxY + 260);
                        let tooClose = false;
                        for (let k = 0; k < N; k += 14) {
                            if (Math.hypot(pts[k].x - x, pts[k].y - y) < def.halfWidth + 55) { tooClose = true; break; }
                        }
                        if (!tooClose) decor.push({ x, y, size: rand(10, 26), variant: Math.random() });
                    }
                }

                return { ...def, pts, tang, norm, total, N, bbox, pads, decor };
            }

            const TRACKS = [
                buildTrack({ id: 'neon', name: 'Circuito Neon', cx: 800, cy: 600, rx: 560, ry: 340, halfWidth: 100, theme: 'grass', harmonics: [{ freq: 2, amp: 0.05, phase: 0 }] }),
                buildTrack({ id: 'hairpin', name: 'Curva Dupla', cx: 800, cy: 600, rx: 520, ry: 300, halfWidth: 92, theme: 'sand', harmonics: [{ freq: 3, amp: 0.22, phase: 0.6 }] }),
                buildTrack({ id: 'chicane', name: 'Deserto Rápido', cx: 800, cy: 600, rx: 600, ry: 260, halfWidth: 96, theme: 'night', harmonics: [{ freq: 2, amp: 0.10, phase: 0 }, { freq: 5, amp: 0.05, phase: 1.2 }] })
            ];

            const THEME_COLORS = {
                grass: { terrain: '#0d2b12', asphalt: '#2a2e3a', decor: '#123a1c' },
                sand: { terrain: '#2c1a10', asphalt: '#332c22', decor: '#5b4326' },
                night: { terrain: '#0a0820', asphalt: '#181422', decor: '#ff2fa0' }
            };

            function findNearestIdx(track, x, y, hint) {
                let best = -1, bestD = Infinity;
                const N = track.N;
                for (let k = -24; k <= 48; k++) {
                    const i = ((hint + k) % N + N) % N;
                    const p = track.pts[i];
                    const dx = p.x - x, dy = p.y - y;
                    const d = dx * dx + dy * dy;
                    if (d < bestD) { bestD = d; best = i; }
                }
                return best;
            }

            // ============================== Session / State ==============================
            const CPU_NAMES = ['Raio', 'Fúria', 'Trovão', 'Faísca', 'Nitro', 'Sombra', 'Foguete', 'Turbo', 'Relâmpago', 'Cobra', 'Ciclone', 'Fantasma'];
            const CPU_COLORS = ['#ff6a1a', '#ff2fa0', '#7cff2f'];
            const PLAYER_COLOR = '#00e5ff';

            let sessionMode = 'quick';
            let sessionTrackIdx = 0;
            let sessionTracks = [0];
            let sessionRaceIndex = 0;
            let difficulty = 0.95;
            let participants = [];
            let tournamentPoints = {};
            let playerSessionScore = 0;

            let state = 'menu'; // menu | countdown | racing | finishOverlay | result | paused
            let cars = [];
            let player = null;
            let track = TRACKS[0];
            let raceClock = 0;
            let countdownValue = 3;
            let countdownTimer = 0;
            let finishTimer = 0;
            let finishSnapshot = null;
            let paused = false;

            let particles = [];
            let confettiParticles = [];
            let camera = { x: 800, y: 600 };
            let zoomCurrent = ZOOM;
            let shake = { x: 0, y: 0, amount: 0 };
            let globalClock = 0;

            let W, H, DPR, topInset = 0;

            // ============================== Input ==============================
            const keys = { left: false, right: false, drift: false, boost: false, brake: false };
            window.addEventListener('keydown', (e) => {
                if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = true;
                if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = true;
                if (['ArrowDown', 's', 'S'].includes(e.key)) keys.brake = true;
                if (e.key === 'Shift') keys.drift = true;
                if (e.key === ' ') { keys.boost = true; e.preventDefault(); }
                if (e.key === 'Escape') togglePause();
            });
            window.addEventListener('keyup', (e) => {
                if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = false;
                if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = false;
                if (['ArrowDown', 's', 'S'].includes(e.key)) keys.brake = false;
                if (e.key === 'Shift') keys.drift = false;
                if (e.key === ' ') keys.boost = false;
            });

            const touchState = { left: false, right: false, drift: false, boost: false };
            function buttonRects() {
                const bw = Math.min(84, W * 0.16), gap = 10;
                const by = H - bw - Math.max(18, H * 0.03);
                return {
                    left: { x: 18, y: by, w: bw, h: bw },
                    right: { x: 18 + bw + gap, y: by, w: bw, h: bw },
                    drift: { x: W - bw * 2 - gap - 18, y: by, w: bw, h: bw },
                    boost: { x: W - bw - 18, y: by, w: bw, h: bw }
                };
            }
            function inRect(px, py, r) { return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h; }

            function recomputeTouchFromList(list) {
                touchState.left = touchState.right = touchState.drift = touchState.boost = false;
                const rects = buttonRects();
                const rect = canvas.getBoundingClientRect();
                for (const t of list) {
                    const px = t.clientX - rect.left, py = t.clientY - rect.top;
                    if (inRect(px, py, rects.left)) touchState.left = true;
                    if (inRect(px, py, rects.right)) touchState.right = true;
                    if (inRect(px, py, rects.drift)) touchState.drift = true;
                    if (inRect(px, py, rects.boost)) touchState.boost = true;
                }
            }
            canvas.addEventListener('touchstart', (e) => { e.preventDefault(); ensureAudio(); recomputeTouchFromList(e.touches); }, { passive: false });
            canvas.addEventListener('touchmove', (e) => { e.preventDefault(); recomputeTouchFromList(e.touches); }, { passive: false });
            canvas.addEventListener('touchend', (e) => { e.preventDefault(); recomputeTouchFromList(e.touches); }, { passive: false });
            canvas.addEventListener('touchcancel', (e) => { e.preventDefault(); recomputeTouchFromList(e.touches); }, { passive: false });

            let mouseDown = false;
            canvas.addEventListener('mousedown', (e) => { mouseDown = true; ensureAudio(); recomputeTouchFromList([e]); });
            window.addEventListener('mouseup', () => { mouseDown = false; recomputeTouchFromList([]); });
            canvas.addEventListener('mousemove', (e) => { if (mouseDown) recomputeTouchFromList([e]); });

            // ============================== Particles ==============================
            function spawnParticle(p) { particles.push(p); }
            function spawnSmoke(car) {
                const back = -CAR_LEN * 0.55;
                const x = car.x + Math.cos(car.velAngle) * back, y = car.y + Math.sin(car.velAngle) * back;
                spawnParticle({ type: 'smoke', x, y, vx: rand(-12, 12), vy: rand(-12, 12), life: rand(0.4, 0.7), maxLife: 0.7, size: rand(4, 8), color: 'rgba(200,200,210,' });
            }
            function spawnDriftSpark(car, side) {
                const backX = -CAR_LEN * 0.42, sideX = side * CAR_W * 0.45;
                const wx = car.x + Math.cos(car.velAngle) * backX + Math.cos(car.velAngle + Math.PI / 2) * sideX;
                const wy = car.y + Math.sin(car.velAngle) * backX + Math.sin(car.velAngle + Math.PI / 2) * sideX;
                spawnParticle({ type: 'spark', x: wx, y: wy, vx: rand(-40, 40), vy: rand(-40, 40), life: rand(0.15, 0.3), maxLife: 0.3, size: rand(2, 4), color: 'rgba(255,190,60,' });
                spawnParticle({ type: 'mark', x: wx, y: wy, angle: car.facing, life: 2.2, maxLife: 2.2, size: 5, color: 'rgba(15,12,10,' });
            }
            function spawnBoostFlame(car) {
                const back = -CAR_LEN * 0.55;
                const x = car.x + Math.cos(car.velAngle) * back, y = car.y + Math.sin(car.velAngle) * back;
                spawnParticle({ type: 'flame', x, y, vx: -Math.cos(car.velAngle) * rand(60, 140) + rand(-20, 20), vy: -Math.sin(car.velAngle) * rand(60, 140) + rand(-20, 20), life: rand(0.2, 0.4), maxLife: 0.4, size: rand(6, 11), color: Math.random() < 0.5 ? 'rgba(255,120,20,' : 'rgba(255,220,60,' });
            }
            function spawnPadBurst(car) {
                for (let i = 0; i < 16; i++) {
                    const a = (i / 16) * Math.PI * 2;
                    spawnParticle({ type: 'spark', x: car.x, y: car.y, vx: Math.cos(a) * rand(60, 160), vy: Math.sin(a) * rand(60, 160), life: 0.5, maxLife: 0.5, size: rand(3, 5), color: 'rgba(255,240,90,' });
                }
            }
            function spawnWallDust(car) {
                for (let i = 0; i < 8; i++) {
                    spawnParticle({ type: 'smoke', x: car.x, y: car.y, vx: rand(-70, 70), vy: rand(-70, 70), life: rand(0.3, 0.6), maxLife: 0.6, size: rand(4, 9), color: 'rgba(190,170,120,' });
                }
            }
            function spawnImpactSpark(x, y) {
                for (let i = 0; i < 10; i++) {
                    const a = rand(0, Math.PI * 2);
                    spawnParticle({ type: 'spark', x, y, vx: Math.cos(a) * rand(60, 150), vy: Math.sin(a) * rand(60, 150), life: 0.35, maxLife: 0.35, size: rand(2, 4), color: 'rgba(255,255,255,' });
                }
            }
            function spawnDriftPerfectBurst(car) {
                for (let i = 0; i < 14; i++) {
                    const a = rand(0, Math.PI * 2);
                    spawnParticle({ type: 'flame', x: car.x, y: car.y, vx: Math.cos(a) * rand(40, 130), vy: Math.sin(a) * rand(40, 130), life: 0.5, maxLife: 0.5, size: rand(4, 8), color: 'rgba(60,230,255,' });
                }
            }

            function updateParticles(dt) {
                for (const p of particles) {
                    if (p.type !== 'mark') { p.x += p.vx * dt; p.y += p.vy * dt; }
                    if (p.type === 'smoke') { p.vy -= 6 * dt; }
                    p.life -= dt;
                }
                particles = particles.filter(p => p.life > 0);
            }

            function drawParticles() {
                for (const p of particles) {
                    const a = clamp(p.life / p.maxLife, 0, 1);
                    ctx.save();
                    if (p.type === 'mark') {
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.angle);
                        ctx.fillStyle = p.color + (a * 0.35) + ')';
                        ctx.fillRect(-6, -1.5, 12, 3);
                    } else {
                        ctx.fillStyle = p.color + a + ')';
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size * (p.type === 'flame' ? (0.5 + a * 0.5) : 1), 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }
            }

            function spawnConfetti() {
                confettiParticles = [];
                for (let i = 0; i < 90; i++) {
                    confettiParticles.push({
                        x: rand(0, W), y: rand(-H * 0.3, 0), vx: rand(-40, 40), vy: rand(60, 160),
                        rot: rand(0, Math.PI * 2), vr: rand(-6, 6), size: rand(5, 10),
                        color: pick(['#ffcf3f', '#00e5ff', '#ff2fa0', '#7cff2f', '#ff6a1a'])
                    });
                }
            }
            function updateConfetti(dt) {
                for (const c of confettiParticles) { c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt; c.vy += 40 * dt; }
                confettiParticles = confettiParticles.filter(c => c.y < H + 30);
            }
            function drawConfetti() {
                for (const c of confettiParticles) {
                    ctx.save();
                    ctx.translate(c.x, c.y);
                    ctx.rotate(c.rot);
                    ctx.fillStyle = c.color;
                    ctx.fillRect(-c.size / 2, -c.size / 3, c.size, c.size * 0.6);
                    ctx.restore();
                }
            }

            // ============================== Cars ==============================
            function makeCar(key, name, color) {
                return {
                    key, name, color,
                    x: 0, y: 0, facing: 0, velAngle: 0, speed: 0,
                    steerInput: 0, driftHold: false, boostHold: false, brakeHeld: false,
                    boost: 0, driftCharge: 0, wasDrifting: false,
                    idx: 0, totalDistance: 0, lap: 0, lastPadIdx: -1,
                    speedMult: 1, ai: null, smokeTimer: 0
                };
            }

            function setupParticipants() {
                const cpuNames = shuffle(CPU_NAMES).slice(0, 3);
                participants = [
                    { key: 'player', name: (nameInput.value || '').trim() || 'Tu', color: PLAYER_COLOR },
                    { key: 'cpu1', name: cpuNames[0], color: CPU_COLORS[0] },
                    { key: 'cpu2', name: cpuNames[1], color: CPU_COLORS[1] },
                    { key: 'cpu3', name: cpuNames[2], color: CPU_COLORS[2] }
                ];
                tournamentPoints = { player: 0, cpu1: 0, cpu2: 0, cpu3: 0 };
                playerSessionScore = 0;
            }

            function makePersonality() {
                return {
                    lookahead: Math.round(rand(18, 28)),
                    steerGain: rand(1.8, 2.4),
                    driftiness: rand(0.35, 0.85),
                    boostChance: rand(0.15, 0.35),
                    speedVar: rand(-0.03, 0.03)
                };
            }

            function startRace(trackIdx) {
                track = TRACKS[trackIdx];
                cars = participants.map(p => makeCar(p.key, p.name, p.color));
                player = cars[0];
                for (const c of cars) if (c.key !== 'player') c.ai = makePersonality();

                const gridOffsets = shuffle([
                    { back: 0, side: -34 }, { back: 0, side: 34 },
                    { back: 55, side: -34 }, { back: 55, side: 34 }
                ]);
                const p0 = track.pts[0], t0 = track.tang[0], n0 = track.norm[0];
                cars.forEach((car, i) => {
                    const g = gridOffsets[i];
                    car.x = p0.x - t0.x * g.back + n0.x * g.side;
                    car.y = p0.y - t0.y * g.back + n0.y * g.side;
                    car.facing = Math.atan2(t0.y, t0.x);
                    car.velAngle = car.facing;
                    car.idx = 0; car.totalDistance = 0; car.lap = 0; car.lastPadIdx = -1;
                    const diffVar = car.key === 'player' ? 1 : difficulty + (car.ai.speedVar || 0);
                    car.speedMult = diffVar;
                });

                camera.x = player.x; camera.y = player.y;
                particles = [];
                raceClock = 0;
                countdownValue = 3;
                countdownTimer = 0;
                state = 'countdown';
                startScreen.style.display = 'none';
                resultScreen.style.display = 'none';
                setInGameControls(true);
                ensureAudio();
            }

            // ============================== AI ==============================
            function updateAI(car, dt) {
                const p = car.ai;
                const targetIdx = (car.idx + p.lookahead) % track.N;
                const t = track.pts[targetIdx];
                const desired = Math.atan2(t.y - car.y, t.x - car.x);
                const diff = normAngle(desired - car.facing);
                car.steerInput = clamp(diff * p.steerGain + rand(-0.06, 0.06), -1, 1);
                car.brakeHeld = false;

                car.driftHold = Math.abs(diff) > 0.5 && car.speed > DRIFT_MIN_SPEED && Math.random() < p.driftiness * dt * 8;
                if (car.driftHold) car._driftLatch = 0.35;
                if (car._driftLatch > 0) { car.driftHold = true; car._driftLatch -= dt; }

                const leaderGap = player.totalDistance - car.totalDistance;
                const rubberBand = clamp(leaderGap / 900, -0.15, 0.18);
                car.speedMult = (difficulty + (p.speedVar || 0)) * (1 + rubberBand);

                if (car.boost >= 55 && Math.random() < p.boostChance * dt) car.boostHold = true;
                if (car.boost <= 2) car.boostHold = false;
            }

            // ============================== Physics ==============================
            function integrateCar(car, dt, isPlayer) {
                const wantsDrift = car.driftHold && Math.abs(car.steerInput) > 0.15 && car.speed > DRIFT_MIN_SPEED;
                const grip = wantsDrift ? GRIP_DRIFT : GRIP_NORMAL;
                const turnMult = wantsDrift ? DRIFT_TURN_MULT : 1;
                const speedFrac = clamp(car.speed / MAX_SPEED, 0, 1.6);
                car.facing += car.steerInput * TURN_RATE * turnMult * (0.6 + 0.4 * Math.min(1, speedFrac)) * dt;

                const boosting = car.boostHold && car.boost > 0;
                const maxSpeedNow = MAX_SPEED * (car.speedMult || 1) * (boosting ? BOOST_MULT : 1);
                if (car.brakeHeld) car.speed -= BRAKE_DECEL * dt;
                else car.speed += ACCEL * dt;
                car.speed = clamp(car.speed, -MAX_SPEED * 0.35, maxSpeedNow);

                car.velAngle = lerpAngle(car.velAngle, car.facing, 1 - Math.exp(-grip * dt));
                car.x += Math.cos(car.velAngle) * car.speed * dt;
                car.y += Math.sin(car.velAngle) * car.speed * dt;

                if (wantsDrift) {
                    car.driftCharge = Math.min(100, car.driftCharge + DRIFT_CHARGE_RATE * dt);
                    car.smokeTimer -= dt;
                    if (car.smokeTimer <= 0) { spawnDriftSpark(car, car.steerInput >= 0 ? 1 : -1); car.smokeTimer = 0.04; }
                    car.wasDrifting = true;
                } else {
                    if (car.wasDrifting && car.driftCharge > 15) {
                        car.boost = Math.min(100, car.boost + car.driftCharge * DRIFT_TO_BOOST);
                        if (car.driftCharge >= DRIFT_PERFECT) { spawnDriftPerfectBurst(car); if (isPlayer) sfx.driftPerfect(); }
                    }
                    car.driftCharge = 0;
                    car.wasDrifting = false;
                }

                if (boosting) {
                    car.boost = Math.max(0, car.boost - BOOST_DRAIN * dt);
                    spawnBoostFlame(car);
                    if (car.boost <= 0) car.boostHold = false;
                } else {
                    car.boost = Math.min(100, car.boost + BOOST_REGEN * dt);
                }

                if (Math.abs(car.speed) > 40 && !wantsDrift) {
                    car.smokeTimer -= dt;
                    if (car.smokeTimer <= 0 && Math.random() < 0.5) { spawnSmoke(car); car.smokeTimer = 0.09; }
                }
            }

            function computeProgress(car) {
                const best = findNearestIdx(track, car.x, car.y, car.idx);
                let idxDelta = best - car.idx;
                if (idxDelta > track.N / 2) idxDelta -= track.N;
                else if (idxDelta < -track.N / 2) idxDelta += track.N;
                car.idx = best;
                car.totalDistance = Math.max(0, car.totalDistance + idxDelta * (track.total / track.N));
                car.lap = Math.floor(car.totalDistance / track.total);

                for (const padIdx of track.pads) {
                    let d = Math.abs(best - padIdx); if (d > track.N / 2) d = track.N - d;
                    if (d <= 2 && car.lastPadIdx !== padIdx) {
                        car.boost = 100; car.lastPadIdx = padIdx;
                        spawnPadBurst(car);
                        if (car === player) sfx.pad();
                    }
                }
                if (car.lastPadIdx !== -1) {
                    let dLast = Math.abs(best - car.lastPadIdx); if (dLast > track.N / 2) dLast = track.N - dLast;
                    if (dLast > 8) car.lastPadIdx = -1;
                }
            }

            function wallCollision(car) {
                const p = track.pts[car.idx], n = track.norm[car.idx], tg = track.tang[car.idx];
                const offset = (car.x - p.x) * n.x + (car.y - p.y) * n.y;
                const limit = track.halfWidth - CAR_RADIUS * 0.7;
                if (Math.abs(offset) > limit) {
                    const sign = offset > 0 ? 1 : -1;
                    car.x -= (offset - sign * limit) * n.x;
                    car.y -= (offset - sign * limit) * n.y;

                    // Redirect the car along the wall instead of just killing its speed: a car that
                    // hits a wall head-on would otherwise stall to near-zero speed and, since turning
                    // authority scales with speed, get permanently trapped spinning against the wall.
                    const vx = Math.cos(car.velAngle) * car.speed, vy = Math.sin(car.velAngle) * car.speed;
                    const alongT = vx * tg.x + vy * tg.y;
                    const dir = alongT >= 0 ? 1 : -1;
                    const newAlongT = dir * clamp(Math.abs(alongT) * OFFTRACK_DAMP, 70, MAX_SPEED);
                    car.velAngle = Math.atan2(tg.y * dir, tg.x * dir);
                    car.facing = car.velAngle;
                    car.speed = Math.abs(newAlongT);

                    spawnWallDust(car);
                    if (car === player) { bumpShake(4); sfx.wall(); }
                }
            }

            function carCollisions() {
                for (let i = 0; i < cars.length; i++) {
                    for (let j = i + 1; j < cars.length; j++) {
                        const a = cars[i], b = cars[j];
                        const dx = b.x - a.x, dy = b.y - a.y;
                        const dist = Math.hypot(dx, dy) || 0.01;
                        const minDist = CAR_RADIUS * 1.8;
                        if (dist < minDist) {
                            const nx = dx / dist, ny = dy / dist;
                            const overlap = (minDist - dist) / 2;
                            a.x -= nx * overlap; a.y -= ny * overlap;
                            b.x += nx * overlap; b.y += ny * overlap;
                            const rel = (b.speed - a.speed) * 0.2;
                            a.speed -= rel * 0.5; b.speed += rel * 0.5;
                            a.speed *= 0.92; b.speed *= 0.92;
                            spawnImpactSpark((a.x + b.x) / 2, (a.y + b.y) / 2);
                            if (a === player || b === player) { bumpShake(3); sfx.bump(); }
                        }
                    }
                }
            }

            function bumpShake(amount) { shake.amount = Math.min(14, shake.amount + amount); }

            // ============================== Race flow ==============================
            function applyPlayerInput() {
                const left = keys.left || touchState.left;
                const right = keys.right || touchState.right;
                player.steerInput = (right ? 1 : 0) - (left ? 1 : 0);
                player.driftHold = keys.drift || touchState.drift;
                player.boostHold = keys.boost || touchState.boost;
                player.brakeHeld = keys.brake;
            }

            function triggerFinish() {
                finishSnapshot = [...cars].sort((a, b) => b.totalDistance - a.totalDistance).map((c, i) => ({ key: c.key, name: c.name, color: c.color, rank: i + 1 }));
                finishTimer = 1.3;
                state = 'finishOverlay';
                sfx.finish();
            }

            function showResultScreen() {
                state = 'result';
                muteEngine();
                setInGameControls(false);

                const playerEntry = finishSnapshot.find(e => e.key === 'player');
                const raceTimeMs = raceClock * 1000;
                const raceScore = RACE_POINTS[playerEntry.rank - 1] * 20 + Math.max(0, Math.floor((70000 - raceTimeMs) / 25));
                playerSessionScore += raceScore;

                finishSnapshot.forEach(e => { tournamentPoints[e.key] = (tournamentPoints[e.key] || 0) + RACE_POINTS[e.rank - 1]; });

                const isTournament = sessionMode === 'tournament';
                const isLastRace = sessionRaceIndex >= sessionTracks.length - 1;
                const medal = (r) => r === 1 ? '🥇' : r === 2 ? '🥈' : r === 3 ? '🥉' : '4️⃣';

                let html = '';
                if (!isTournament || !isLastRace) {
                    html += `<div class="sub" style="letter-spacing:0.15em;">${track.name.toUpperCase()}</div>`;
                    html += `<div class="bannerText" style="margin-bottom:10px;">${medal(playerEntry.rank)} ${ordinal(playerEntry.rank)} LUGAR</div>`;
                    html += '<table class="resultTable"><tbody>';
                    finishSnapshot.forEach(e => {
                        html += `<tr class="${e.key === 'player' ? 'me' : ''}"><td class="medal">${medal(e.rank)}</td><td><span class="swatch" style="background:${e.color}"></span>${e.name}</td></tr>`;
                    });
                    html += '</tbody></table>';

                    if (isTournament) {
                        html += `<div class="sectionLabel" style="margin-top:14px;">CLASSIFICAÇÃO DO TORNEIO — CORRIDA ${sessionRaceIndex + 1}/${sessionTracks.length}</div>`;
                        html += buildStandingsTable();
                        html += `<button class="btn" id="nextRaceBtn">PRÓXIMA CORRIDA →</button>`;
                    } else {
                        html += `<div class="sectionLabel" style="margin-top:10px;">Tempo: ${fmtTime(raceTimeMs)} · Pontos: ${raceScore}</div>`;
                        html += `<button class="btn" id="againBtn">CORRIDA OUTRA VEZ</button><button class="btnOutline" id="menuBtn">MENU</button>`;
                    }
                } else {
                    const standings = Object.keys(tournamentPoints).map(k => ({ key: k, points: tournamentPoints[k], info: participants.find(p => p.key === k) })).sort((a, b) => b.points - a.points);
                    const playerFinal = standings.findIndex(s => s.key === 'player') + 1;
                    html += `<div class="bannerText" style="margin-bottom:6px;">🏁 TORNEIO CONCLUÍDO</div>`;
                    html += `<div class="sub" style="letter-spacing:0.15em;">${playerFinal === 1 ? 'CAMPEÃO DA ARCADE!' : ordinal(playerFinal) + ' LUGAR NO TORNEIO'}</div>`;
                    html += buildStandingsTableFrom(standings);
                    html += `<div class="sectionLabel" style="margin-top:10px;">Pontuação total: ${playerSessionScore}</div>`;
                    html += `<button class="btn" id="menuBtn">VOLTAR AO MENU</button>`;
                    submitScore(participants[0].name, playerSessionScore);
                    if (playerFinal <= 3) spawnConfetti();
                }

                resultBody.innerHTML = html;
                resultScreen.style.display = 'flex';

                if (!isTournament) submitScore(participants[0].name, playerSessionScore);

                const nextBtn = document.getElementById('nextRaceBtn');
                if (nextBtn) nextBtn.addEventListener('click', () => {
                    sessionRaceIndex++;
                    startRace(sessionTracks[sessionRaceIndex]);
                });
                const againBtn = document.getElementById('againBtn');
                if (againBtn) againBtn.addEventListener('click', () => { setupParticipants(); sessionRaceIndex = 0; startRace(sessionTracks[0]); });
                const menuBtn = document.getElementById('menuBtn');
                if (menuBtn) menuBtn.addEventListener('click', () => { resultScreen.style.display = 'none'; startScreen.style.display = 'flex'; state = 'menu'; confettiParticles = []; });
            }

            function buildStandingsTable() { return buildStandingsTableFrom(Object.keys(tournamentPoints).map(k => ({ key: k, points: tournamentPoints[k], info: participants.find(p => p.key === k) })).sort((a, b) => b.points - a.points)); }
            function buildStandingsTableFrom(standings) {
                let html = '<table class="resultTable"><tbody>';
                standings.forEach((s, i) => {
                    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '4️⃣';
                    html += `<tr class="${s.key === 'player' ? 'me' : ''}"><td class="medal">${medal}</td><td><span class="swatch" style="background:${s.info.color}"></span>${s.info.name}</td><td>${s.points} pts</td></tr>`;
                });
                html += '</tbody></table>';
                return html;
            }

            function returnToMenuAbort() {
                muteEngine();
                state = 'menu';
                paused = false;
                pauseScreen.style.display = 'none';
                startScreen.style.display = 'flex';
                setInGameControls(false);
            }

            function togglePause() {
                if (state !== 'racing') return;
                paused = !paused;
                pauseScreen.style.display = paused ? 'flex' : 'none';
                if (paused) muteEngine();
            }

            // ============================== Update / Draw ==============================
            function updateRace(dt) {
                raceClock += dt;
                applyPlayerInput();
                for (const car of cars) if (car !== player) updateAI(car, dt);
                for (const car of cars) integrateCar(car, dt, car === player);
                for (const car of cars) computeProgress(car);
                for (const car of cars) wallCollision(car);
                carCollisions();

                const prevLap = player._lastLap || 0;
                if (player.lap > prevLap && player.lap < LAPS_REQUIRED) sfx.lap();
                player._lastLap = player.lap;

                if (player.lap >= LAPS_REQUIRED) { triggerFinish(); return; }

                updateEngineSound(clamp(player.speed / MAX_SPEED, 0, 1), player.boostHold && player.boost > 0);
            }

            function updateCamera(dt) {
                camera.x += (player.x - camera.x) * Math.min(1, CAM_FOLLOW * dt);
                camera.y += (player.y - camera.y) * Math.min(1, CAM_FOLLOW * dt);
                const targetZoom = (player.boostHold && player.boost > 0) ? ZOOM * 0.92 : ZOOM;
                zoomCurrent += (targetZoom - zoomCurrent) * Math.min(1, 4 * dt);
                shake.amount *= Math.exp(-8 * dt);
                shake.x = (Math.random() - 0.5) * shake.amount;
                shake.y = (Math.random() - 0.5) * shake.amount;
            }

            function rrect(x, y, w, h, r) {
                if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
                else { ctx.beginPath(); ctx.rect(x, y, w, h); }
            }

            function drawDecorShape(theme, x, y, size, variant) {
                ctx.save();
                ctx.translate(x, y);
                if (theme === 'grass') {
                    ctx.fillStyle = variant > 0.5 ? '#1c5a26' : '#123a1c';
                    ctx.beginPath(); ctx.ellipse(0, 0, size, size * 0.75, 0, 0, Math.PI * 2); ctx.fill();
                } else {
                    if (variant > 0.6) {
                        ctx.fillStyle = '#3a7d3f';
                        ctx.fillRect(-2, -size, 4, size);
                        ctx.fillRect(-size * 0.4, -size * 0.6, size * 0.4, 4);
                        ctx.fillRect(0, -size * 0.4, size * 0.4, 4);
                    } else {
                        ctx.fillStyle = '#6b5333';
                        ctx.beginPath(); ctx.ellipse(0, 0, size * 0.7, size * 0.45, 0, 0, Math.PI * 2); ctx.fill();
                    }
                }
                ctx.restore();
            }

            function drawBackground() {
                const colors = THEME_COLORS[track.theme];
                if (track.theme === 'night') {
                    const grad = ctx.createLinearGradient(0, 0, 0, H);
                    grad.addColorStop(0, '#1a0b2e');
                    grad.addColorStop(0.55, '#3a123f');
                    grad.addColorStop(1, '#0a0820');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, W, H);
                } else {
                    ctx.fillStyle = colors.terrain;
                    ctx.fillRect(0, 0, W, H);
                }
            }

            function drawWorld() {
                const colors = THEME_COLORS[track.theme];
                ctx.save();
                ctx.fillStyle = colors.terrain;
                ctx.fillRect(track.bbox.minX - 500, track.bbox.minY - 500, track.bbox.w + 1000, track.bbox.h + 1000);

                if (track.theme === 'night') {
                    const pulse = 0.5 + 0.5 * Math.sin(globalClock * 1.4);
                    ctx.save();
                    const sunX = track.cx, sunY = track.bbox.minY - 260;
                    const g = ctx.createRadialGradient(sunX, sunY, 20, sunX, sunY, 220 + pulse * 20);
                    g.addColorStop(0, 'rgba(255,150,90,0.9)');
                    g.addColorStop(1, 'rgba(255,60,140,0)');
                    ctx.fillStyle = g;
                    ctx.beginPath(); ctx.arc(sunX, sunY, 220 + pulse * 20, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();

                    ctx.strokeStyle = 'rgba(255,45,170,0.18)';
                    ctx.lineWidth = 2;
                    const spacing = 90;
                    for (let x = track.bbox.minX - 700; x < track.bbox.maxX + 700; x += spacing) {
                        ctx.beginPath(); ctx.moveTo(x, track.bbox.minY - 700); ctx.lineTo(x, track.bbox.maxY + 700); ctx.stroke();
                    }
                    for (let y = track.bbox.minY - 700; y < track.bbox.maxY + 700; y += spacing) {
                        ctx.beginPath(); ctx.moveTo(track.bbox.minX - 700, y); ctx.lineTo(track.bbox.maxX + 700, y); ctx.stroke();
                    }
                } else {
                    for (const d of track.decor) drawDecorShape(track.theme, d.x, d.y, d.size, d.variant);
                }

                drawTrack();
                drawParticles();
                drawCars();
                ctx.restore();
            }

            function drawWorldWithCamera() {
                ctx.save();
                ctx.translate(W / 2 + shake.x, H / 2 + shake.y);
                ctx.scale(zoomCurrent, zoomCurrent);
                ctx.translate(-camera.x, -camera.y);
                drawWorld();
                ctx.restore();
            }

            function drawTrack() {
                const colors = THEME_COLORS[track.theme];
                ctx.beginPath();
                for (let i = 0; i <= track.N; i++) {
                    const idx = i % track.N; const p = track.pts[idx], n = track.norm[idx];
                    const ox = p.x + n.x * track.halfWidth, oy = p.y + n.y * track.halfWidth;
                    if (i === 0) ctx.moveTo(ox, oy); else ctx.lineTo(ox, oy);
                }
                for (let i = track.N; i >= 0; i--) {
                    const idx = i % track.N; const p = track.pts[idx], n = track.norm[idx];
                    ctx.lineTo(p.x - n.x * track.halfWidth, p.y - n.y * track.halfWidth);
                }
                ctx.closePath();
                ctx.fillStyle = colors.asphalt;
                ctx.fill();
                if (track.theme === 'night') {
                    ctx.save();
                    ctx.strokeStyle = 'rgba(0,229,255,0.5)';
                    ctx.lineWidth = 3;
                    ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 8;
                    ctx.beginPath();
                    for (let i = 0; i <= track.N; i++) { const idx = i % track.N; const p = track.pts[idx], n = track.norm[idx]; const x = p.x + n.x * track.halfWidth, y = p.y + n.y * track.halfWidth; if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
                    ctx.stroke();
                    ctx.strokeStyle = 'rgba(255,47,160,0.5)';
                    ctx.beginPath();
                    for (let i = 0; i <= track.N; i++) { const idx = i % track.N; const p = track.pts[idx], n = track.norm[idx]; const x = p.x - n.x * track.halfWidth, y = p.y - n.y * track.halfWidth; if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
                    ctx.stroke();
                    ctx.restore();
                } else {
                    for (let i = 0; i < track.N; i += 6) {
                        const color = (Math.floor(i / 6) % 2 === 0) ? '#e6e6e6' : '#d81e1e';
                        const p = track.pts[i], n = track.norm[i], tg = track.tang[i];
                        const ang = Math.atan2(tg.y, tg.x);
                        for (const side of [1, -1]) {
                            ctx.save();
                            ctx.translate(p.x + n.x * track.halfWidth * side, p.y + n.y * track.halfWidth * side);
                            ctx.rotate(ang);
                            ctx.fillStyle = color;
                            ctx.fillRect(-5, -6, 10, 12);
                            ctx.restore();
                        }
                    }
                }

                ctx.setLineDash([14, 14]);
                ctx.strokeStyle = 'rgba(255,255,255,0.22)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                for (let i = 0; i <= track.N; i++) { const idx = i % track.N; const p = track.pts[idx]; if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); }
                ctx.stroke();
                ctx.setLineDash([]);

                const p0 = track.pts[0], n0 = track.norm[0], tg0 = track.tang[0];
                const ang0 = Math.atan2(tg0.y, tg0.x);
                const steps = 10;
                for (let s = 0; s < steps; s++) {
                    const t = (s / steps - 0.5) * 2 * track.halfWidth;
                    ctx.save();
                    ctx.translate(p0.x + n0.x * t, p0.y + n0.y * t);
                    ctx.rotate(ang0);
                    ctx.fillStyle = s % 2 === 0 ? '#111' : '#eee';
                    ctx.fillRect(-6, -((track.halfWidth * 2) / steps) / 2, 12, (track.halfWidth * 2) / steps);
                    ctx.restore();
                }

                for (const padIdx of track.pads) {
                    const p = track.pts[padIdx];
                    const pulse = 1 + 0.15 * Math.sin(globalClock * 5 + padIdx);
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.strokeStyle = 'rgba(255,230,80,0.85)';
                    ctx.lineWidth = 4;
                    ctx.shadowColor = '#ffe650'; ctx.shadowBlur = 10;
                    ctx.beginPath(); ctx.arc(0, 0, 22 * pulse, 0, Math.PI * 2); ctx.stroke();
                    ctx.fillStyle = '#ffe650';
                    ctx.font = 'bold 22px sans-serif';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('⚡', 0, 1);
                    ctx.restore();
                }
            }

            function drawCars() {
                const sorted = [...cars].sort((a, b) => a.y - b.y);
                for (const car of sorted) {
                    ctx.save();
                    ctx.translate(car.x, car.y);
                    const speedFrac = clamp(car.speed / MAX_SPEED, 0, 1.4);
                    const lean = clamp(car.steerInput * Math.min(1, speedFrac) * 0.12, -0.14, 0.14);
                    ctx.rotate(car.velAngle);

                    ctx.fillStyle = 'rgba(0,0,0,0.35)';
                    ctx.beginPath(); ctx.ellipse(3, 5, CAR_LEN * 0.55, CAR_W * 0.55, 0, 0, Math.PI * 2); ctx.fill();

                    ctx.transform(1, 0, lean, 1, 0, 0);
                    ctx.fillStyle = car.color;
                    rrect(-CAR_LEN / 2, -CAR_W / 2, CAR_LEN, CAR_W, 6);
                    ctx.fill();

                    ctx.fillStyle = 'rgba(8,8,16,0.85)';
                    rrect(-CAR_LEN * 0.06, -CAR_W * 0.32, CAR_LEN * 0.4, CAR_W * 0.64, 4);
                    ctx.fill();

                    ctx.fillStyle = 'rgba(255,255,255,0.85)';
                    ctx.fillRect(CAR_LEN * 0.38, -CAR_W * 0.28, 3, CAR_W * 0.2);
                    ctx.fillRect(CAR_LEN * 0.38, CAR_W * 0.08, 3, CAR_W * 0.2);

                    if (car.boostHold && car.boost > 0) {
                        ctx.fillStyle = 'rgba(255,120,20,0.9)';
                        ctx.beginPath();
                        ctx.moveTo(-CAR_LEN / 2, -4); ctx.lineTo(-CAR_LEN / 2 - 14 - Math.random() * 6, 0); ctx.lineTo(-CAR_LEN / 2, 4);
                        ctx.fill();
                    }
                    ctx.restore();

                    drawNameTag(car);
                }
            }

            function drawNameTag(car) {
                ctx.save();
                ctx.translate(car.x, car.y - CAR_W - 6);
                ctx.font = 'bold 11px monospace';
                ctx.textAlign = 'center';
                ctx.fillStyle = car.color;
                ctx.globalAlpha = 0.85;
                ctx.fillText(car.name, 0, 0);
                ctx.restore();
            }

            function drawTouchControls() {
                const rects = buttonRects();
                const draw = (r, active, label) => {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(r.x + r.w / 2, r.y + r.h / 2, r.w / 2, 0, Math.PI * 2);
                    ctx.fillStyle = active ? 'rgba(0,229,255,0.45)' : 'rgba(255,255,255,0.12)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.fillStyle = '#fff';
                    ctx.font = `bold ${Math.floor(r.w * 0.32)}px monospace`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2 + 1);
                    ctx.restore();
                };
                draw(rects.left, keys.left || touchState.left, '◀');
                draw(rects.right, keys.right || touchState.right, '▶');
                draw(rects.drift, keys.drift || touchState.drift, 'DR');
                draw(rects.boost, keys.boost || touchState.boost, '🔥');
            }

            function drawHUD() {
                const ranks = [...cars].sort((a, b) => b.totalDistance - a.totalDistance);
                const playerRank = ranks.indexOf(player) + 1;

                ctx.save();
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 6;
                ctx.fillStyle = '#fff';
                ctx.font = `bold ${Math.floor(Math.min(W, H) * 0.07)}px monospace`;
                ctx.fillText(ordinal(playerRank), W / 2, H * 0.10);
                ctx.font = `bold ${Math.floor(Math.min(W, H) * 0.03)}px monospace`;
                ctx.fillStyle = '#00e5ff';
                ctx.fillText(`VOLTA ${Math.min(player.lap + 1, LAPS_REQUIRED)}/${LAPS_REQUIRED}`, W / 2, H * 0.145);
                ctx.restore();

                ctx.save();
                ctx.textAlign = 'left';
                ctx.font = 'bold 16px monospace';
                ctx.fillStyle = '#fff';
                ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 4;
                ctx.fillText(fmtTime(raceClock * 1000), 16, topInset + 20);
                ctx.restore();

                const bw = Math.min(220, W * 0.5), bh = 14;
                const bx = W / 2 - bw / 2, by = H - Math.max(18, H * 0.03) - Math.min(84, W * 0.16) - 26;
                ctx.save();
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 2;
                rrect(bx, by, bw, bh, 6); ctx.stroke();
                const full = player.boost >= 99.5;
                const pulse = full ? 0.75 + 0.25 * Math.sin(globalClock * 10) : 1;
                ctx.fillStyle = full ? `rgba(0,229,255,${pulse})` : player.boost > 55 ? '#ffcf3f' : '#7cff2f';
                rrect(bx + 2, by + 2, Math.max(0, (bw - 4) * (player.boost / 100)), bh - 4, 4); ctx.fill();
                ctx.restore();

                drawMinimap();
            }

            function drawMinimap() {
                const mw = 108, mh = 78;
                const mx = W - mw - 14, my = topInset + 10;
                const sx = (mw - 10) / track.bbox.w, sy = (mh - 10) / track.bbox.h;
                const s = Math.min(sx, sy);
                ctx.save();
                ctx.fillStyle = 'rgba(0,0,0,0.45)';
                rrect(mx, my, mw, mh, 6); ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i <= track.N; i += 4) {
                    const idx = i % track.N; const p = track.pts[idx];
                    const px = mx + 5 + (p.x - track.bbox.minX) * s, py = my + 5 + (p.y - track.bbox.minY) * s;
                    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.stroke();
                for (const car of cars) {
                    const px = mx + 5 + (car.x - track.bbox.minX) * s, py = my + 5 + (car.y - track.bbox.minY) * s;
                    const r = car === player ? 3.5 + Math.sin(globalClock * 6) * 0.8 : 2.6;
                    ctx.fillStyle = car.color;
                    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();
            }

            function drawCountdown() {
                drawBackground();
                drawWorldWithCamera();
                ctx.save();
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                const label = countdownValue > 0 ? String(countdownValue) : 'GO!';
                const pop = 1 + 0.35 * Math.max(0, 1 - countdownTimer % 1);
                ctx.font = `bold ${Math.floor(Math.min(W, H) * 0.22 * pop)}px monospace`;
                ctx.fillStyle = countdownValue > 0 ? '#ffcf3f' : '#00e5ff';
                ctx.shadowColor = countdownValue > 0 ? '#ff2fa0' : '#00e5ff';
                ctx.shadowBlur = 30;
                ctx.fillText(label, W / 2, H / 2);
                ctx.restore();
                drawHUD();
            }

            function drawFinishOverlay() {
                drawBackground();
                drawWorldWithCamera();
                drawHUD();
                ctx.save();
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                const pulse = 1 + 0.08 * Math.sin(globalClock * 10);
                ctx.font = `bold ${Math.floor(Math.min(W, H) * 0.1 * pulse)}px monospace`;
                ctx.fillStyle = '#ffcf3f';
                ctx.shadowColor = '#ff2fa0'; ctx.shadowBlur = 24;
                ctx.fillText('🏁 CHEGASTE!', W / 2, H * 0.4);
                ctx.restore();
            }

            function render() {
                drawBackground();
                drawWorldWithCamera();

                if (state === 'racing' || state === 'paused') { drawHUD(); drawTouchControls(); }
                if (confettiParticles.length) drawConfetti();
            }

            function loop(ts) {
                requestAnimationFrame(loop);
                if (!lastTs) lastTs = ts;
                const dt = Math.min(0.05, (ts - lastTs) / 1000);
                lastTs = ts;
                globalClock += dt;

                if (state === 'countdown') {
                    countdownTimer += dt;
                    if (countdownTimer >= 1) {
                        countdownTimer = 0;
                        if (countdownValue > 0) { sfx.tick(); countdownValue--; }
                        else { sfx.go(); state = 'racing'; lastTs = ts; }
                    }
                    drawCountdown();
                } else if (state === 'racing') {
                    if (!paused) updateRace(dt);
                    updateCamera(dt);
                    updateParticles(dt);
                    render();
                } else if (state === 'finishOverlay') {
                    for (const car of cars) if (car !== player) updateAI(car, dt);
                    for (const car of cars) integrateCar(car, dt, false);
                    for (const car of cars) computeProgress(car);
                    for (const car of cars) wallCollision(car);
                    carCollisions();
                    updateCamera(dt);
                    updateParticles(dt);
                    finishTimer -= dt;
                    drawFinishOverlay();
                    if (finishTimer <= 0) showResultScreen();
                } else if (state === 'result') {
                    updateConfetti(dt);
                    render();
                } else {
                    render();
                }
            }
            let lastTs = 0;

            // ============================== Resize ==============================
            function resize() {
                DPR = window.devicePixelRatio || 1;
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                canvas.width = W * DPR;
                canvas.height = H * DPR;
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                const barRect = topBar.getBoundingClientRect();
                topInset = barRect.bottom + 6;
            }
            window.addEventListener('resize', resize);
            window.addEventListener('orientationchange', () => setTimeout(resize, 200));

            // ============================== Menu wiring ==============================
            modeRow.addEventListener('click', (e) => {
                const btn = e.target.closest('.modeBtn');
                if (!btn) return;
                [...modeRow.children].forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                sessionMode = btn.dataset.mode;
                document.getElementById('trackRow').style.display = sessionMode === 'quick' ? 'flex' : 'none';
            });
            trackRow.addEventListener('click', (e) => {
                const btn = e.target.closest('.trackBtn');
                if (!btn) return;
                [...trackRow.children].forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                sessionTrackIdx = parseInt(btn.dataset.track, 10);
            });
            diffRow.addEventListener('click', (e) => {
                const btn = e.target.closest('.diffBtn');
                if (!btn) return;
                [...diffRow.children].forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                difficulty = parseFloat(btn.dataset.lvl);
            });

            startBtn.addEventListener('click', () => {
                setupParticipants();
                sessionRaceIndex = 0;
                sessionTracks = sessionMode === 'tournament' ? [0, 1, 2] : [sessionTrackIdx];
                startRace(sessionTracks[0]);
            });

            pauseBtn.addEventListener('click', togglePause);
            resumeBtn.addEventListener('click', togglePause);
            quitBtn.addEventListener('click', returnToMenuAbort);
            endBtn.addEventListener('click', () => { if (state === 'racing' || paused) returnToMenuAbort(); });

            resize();
            requestAnimationFrame(loop);
        })();
    </script>
</body>
</html>
