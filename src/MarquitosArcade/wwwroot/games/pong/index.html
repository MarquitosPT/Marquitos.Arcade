<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pong Retro | Marquitos Arcade</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon3_64x64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon3_32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon3_16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon3.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#111127" />
    <meta name="msapplication-TileColor" content="#123a5e" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Marquitos Arcade" />

    <!-- Ecrã de arranque partilhado pela arcada (lib/arcade/splash.*). Vem antes
         das folhas do jogo porque é o primeiro que se vê, e o logótipo é
         pré-carregado para não aparecer a meio da animação. -->
    <link rel="preload" as="image" href="/logo3.png" />
    <link rel="stylesheet" href="/lib/arcade/splash.css" />
    <script type="module" src="/lib/arcade/splash-boot.js"></script>

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/hud.css" />
    <link rel="stylesheet" href="css/screens.css" />
    <link rel="stylesheet" href="css/controls.css" />
</head>

<body>
    <!-- Ecrã de arranque: fica no ar pelo menos 3s (ver lib/arcade/splash.js). -->
    <div id="arcadeSplash" class="arcade-splash">
        <div class="arcade-splash-rays" aria-hidden="true"></div>
        <div class="arcade-splash-pixels" aria-hidden="true"></div>
        <div class="arcade-splash-stage">
            <img class="arcade-splash-logo" src="/logo3.png" width="512" height="366"
                 alt="MarquitosPT Game Arcade" fetchpriority="high" decoding="async" />
            <p class="arcade-splash-caption">Pong Retro</p>
            <p class="arcade-splash-status" role="status">A carregar&hellip;</p>
            <div class="arcade-splash-track" role="progressbar" aria-label="Progresso do carregamento"
                 aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="arcade-splash-fill"></div>
            </div>
        </div>
    </div>

    <div id="wrap">
        <div class="topBar">
            <a class="topBtn" id="arcadeLink" href="/">← ARCADE</a>
            <a class="topBtn" id="scoresLink" href="/pontuacoes?jogo=pong#pong">🏆</a>
            <button class="topBtn" id="pauseBtn">II</button>
            <button class="topBtn" id="endBtn">✕ SAIR</button>
        </div>
        <canvas id="game"></canvas>

        <div id="startScreen">
            <div class="title">PONG</div>
            <div class="sub">RETRO • ARCADE</div>

            <div class="row" id="modeRow">
                <button class="modeBtn active" data-mode="single">1 JOGADOR</button>
                <button class="modeBtn" data-mode="two">2 JOGADORES</button>
            </div>

            <div id="nameRow" class="row">
                <input type="text" id="playerNameInput" class="nameInput" placeholder="O TEU NOME" maxlength="20">
            </div>

            <div id="diffRow" class="row">
                <button class="diffBtn" data-lvl="0.6">FÁCIL</button>
                <button class="diffBtn active" data-lvl="0.85">MÉDIO</button>
                <button class="diffBtn" data-lvl="1.05">DIFÍCIL</button>
            </div>

            <div id="rotateWarning">📱 GIRE O IPHONE<br>PARA O MODO PAISAGEM</div>

            <button class="btn" id="startBtn">JOGAR</button>
            <div id="hint">Arraste na tela para mover</div>
        </div>

        <div id="pauseScreen">
            <div class="title">PAUSA</div>
            <button class="btn" id="resumeBtn">CONTINUAR</button>
        </div>
    </div>


    <script type="module" src="js/main.js"></script>
</body>

</html>
